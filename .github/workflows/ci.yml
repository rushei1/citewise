name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # requirements-dev.txt excludes torch/transformers/sentence-transformers on purpose.
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=app --cov-report=term-missing
      # Model-free smoke test of the evaluation code path (not real results).
      - run: python -m eval.run_clustering --quick
      - run: python -m eval.run_summarization --quick
      - run: python -m eval.report --quick
