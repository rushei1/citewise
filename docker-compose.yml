services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HF_HOME: /home/app/.cache/huggingface
      DB_PATH: /app/data/reviews.db
      LLM_CACHE_PATH: /app/data/llm_cache.db
      # Optional LLM backend: set these in your shell or a .env next to this file
      SUMMARIZER_BACKEND: ${SUMMARIZER_BACKEND:-hf}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - db_data:/app/data
      - hf_cache:/home/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      API_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
  hf_cache:
