services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HF_HOME: /home/app/.cache/huggingface
      DB_PATH: /app/data/reviews.db
    ports:
      - "8000:8000"
    volumes:
      - db_data:/app/data
      - hf_cache:/home/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      API_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
  hf_cache:
